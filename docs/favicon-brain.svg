<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Brain shape (two lobes) -->
  <!-- Left lobe -->
  <path d="M20 38
    C14 38 11 34 11 29
    C11 24 15 20 19 20
    C19 17 21 15 24 15
    C26 13 29 14 30 16
    L30 38 Z"
    fill="#e0f2fe" opacity="0.95"/>

  <!-- Right lobe -->
  <path d="M44 38
    C50 38 53 34 53 29
    C53 24 49 20 45 20
    C45 17 43 15 40 15
    C38 13 35 14 34 16
    L34 38 Z"
    fill="#e0f2fe" opacity="0.95"/>

  <!-- Brain stem / bottom -->
  <path d="M26 38 C26 42 28 44 32 44 C36 44 38 42 38 38 Z"
    fill="#e0f2fe" opacity="0.95"/>

  <!-- Center divide -->
  <line x1="32" y1="16" x2="32" y2="43" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Brain grooves left -->
  <path d="M18 26 C22 24 24 28 20 30" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16 33 C20 31 23 34 19 36" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Brain grooves right -->
  <path d="M46 26 C42 24 40 28 44 30" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M48 33 C44 31 41 34 45 36" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Coral loop arrow around brain -->
  <path d="M16 46 C10 40 9 28 16 20 C20 15 26 13 32 13"
    fill="none" stroke="url(#loop)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M32 13 C38 13 44 15 48 20 C55 28 54 40 48 46"
    fill="none" stroke="url(#loop)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arrow head right -->
  <polygon points="48,46 43,43 50,41" fill="#fb923c"/>
  <!-- Dot on left start -->
  <circle cx="16" cy="46" r="2.2" fill="#fb923c"/>
</svg>
