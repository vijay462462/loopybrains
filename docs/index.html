<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RGUKT Spark</title>
<meta name="description" content="RGUKT Spark — ask doubts, share ideas and run clubs together. Every question brings you closer to the answer.">
<meta name="theme-color" content="#7c3aed">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="referrer" content="no-referrer">
<meta name="google-site-verification" content="8zziFNIfoZZ654HegVIDMQ3SsLqLZpIEvYSJ3swfobw" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://api.dicebear.com https://img.youtube.com data: blob:; media-src 'self' blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com wss://*.firebaseio.com https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;">

<!-- PWA -->
<link rel="manifest" href="manifest.json?v=153">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spark">
<link rel="apple-touch-icon" href="icon.svg">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=153">
<link rel="stylesheet" href="sparkbot.css?v=153">
<link rel="stylesheet" href="player.css?v=153">
<link rel="stylesheet" href="lab.css?v=153">
</head>
<body>

<!-- offline indicator -->
<div id="offlineBar" class="offline-bar" hidden>📵 You're offline — showing cached posts</div>

<!-- PWA install prompt -->
<div id="installBanner" class="install-banner" hidden>
  <span class="install-text">📲 Add RGUKT Spark to your home screen for quick access!</span>
  <button class="btn primary sm" id="installBtn" type="button">Install App</button>
  <button class="install-close" id="installDismiss" type="button" aria-label="Dismiss">✕</button>
</div>

<!-- new posts toast -->
<div id="newToast" class="new-toast" hidden role="status" aria-live="polite"><span>New posts arrived — tap to see ↑</span></div>

<div class="wrap">
  <canvas id="particles" aria-hidden="true"></canvas>
  <header class="top">
    <div class="brand">
      <h1 id="siteTitle">RGUKT <span>Spark</span></h1>
      <p id="tagline">One doubt. Many minds. Zero fear.</p>
      <div class="exams" id="exams" hidden></div>
      <div class="tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" data-tab="doubts" aria-selected="true">Doubts</button>
        <button type="button" role="tab" data-tab="ideas" aria-selected="false">Ideas</button>
        <button type="button" role="tab" data-tab="clubs" aria-selected="false">🏛 Clubs</button>
        <button type="button" role="tab" data-tab="challenges" aria-selected="false">🎮 Challenges</button>
        <button type="button" role="tab" data-tab="market" aria-selected="false">🛒 Market</button>
        <button type="button" role="tab" data-tab="gate" aria-selected="false">🎯 GATE</button>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="chip" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark/light">🌙</button>
      <button class="chip tool" id="quizBtn" type="button"><span class="ci">🧠</span> <span class="cl">Daily Quiz</span></button>
      <button class="chip tool" id="learnBtn" type="button"><span class="ci">📚</span> <span class="cl">Learn from IIT</span></button>
      <button class="chip tool" id="studyBtn" type="button"><span class="ci">📖</span> <span class="cl">Study Tools</span></button>
      <button class="chip tool" id="careerBtn" type="button"><span class="ci">🚀</span> <span class="cl">Career Guide</span></button>
      <button class="chip tool" id="aboutBtn" type="button"><span class="ci">ℹ️</span> <span class="cl">About Us</span></button>
      <button class="chip tool" id="leadersBtn" type="button"><span class="ci">🏆</span> <span class="cl">Top Helpers</span></button>
      <button class="chip tool" id="labBtn" type="button"><span class="ci">🧪</span> <span class="cl">Study Lab · Focus · Cards · CGPA</span></button>
      <button class="chip" id="nameBtn" type="button">Set your name</button>
      <button class="btn primary" id="askBtn" type="button">Ask a doubt</button>
      <button class="chip filter-toggle" id="filterToggle" type="button" aria-expanded="false">🎚️ Filters</button>
      <button class="chip tool" id="alumniBtn" type="button"><span class="ci">🎓</span> <span class="cl">Alumni</span></button>
      <button class="chip tool" id="botBtn" type="button"><span class="ci">🤖</span> <span class="cl">Spark Bot</span></button>
      <button class="chip tool" id="funBtn" type="button"><span class="ci">🎉</span> <span class="cl">Entertainment</span></button>
    </div>
    <div id="campusBar" class="campus-bar" hidden></div>
    <div id="yearBar" class="campus-bar" hidden></div>
    <div id="trending" class="trending-inline" hidden></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <!-- trending subjects bar -->
  <div class="trend-bar" id="trendBar" hidden></div>


<div class="layout">
    <nav class="rail" id="rail" aria-label="Subjects"></nav>

    <section class="listcol" aria-label="Posts">
      <div class="tools">
        <input id="search" type="search" name="spark-search" placeholder="Search (press / to focus)" aria-label="Search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <select id="filter" aria-label="Filter"></select>
      </div>
      <div class="list" id="list"></div>
    </section>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </div>
</div>

<!-- bottom navigation (mobile only) -->
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>

<script src="config.js?v=153"></script>
<script src="quiz.js?v=153"></script>
<script type="module" src="app.js?v=153"></script>
<script src="sparkbot.js?v=153"></script>
<script src="player.js?v=153"></script>
<script src="tools-core.js?v=153"></script>
<script src="tools-math.js?v=153"></script>
<script src="tools-eng.js?v=153"></script>
<script src="tools-life.js?v=153"></script>
<script src="lab.js?v=153"></script>
</body>
</html>
