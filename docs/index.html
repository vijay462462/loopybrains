<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubt Desk</title>
<meta name="description" content="Class board where students ask doubts, answer each other, and share ideas.">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Doubt <span>Desk</span></h1>
      <p id="tagline">Stuck on a problem? Post your doubt, and classmates can answer it.</p>
      <div class="tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" data-tab="doubts" aria-selected="true">Doubts</button>
        <button type="button" role="tab" data-tab="ideas" aria-selected="false">Ideas</button>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="chip" id="nameBtn" type="button">Set your name</button>
      <button class="btn primary" id="askBtn" type="button">Ask a doubt</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Subjects"></nav>

    <section class="listcol" aria-label="Posts">
      <div class="tools">
        <input id="search" type="search" placeholder="Search" aria-label="Search">
        <select id="filter" aria-label="Filter"></select>
      </div>
      <div class="list" id="list">
        <div class="empty"><strong>Loading…</strong>Connecting to the class board.</div>
      </div>
    </section>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </div>
</div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
