name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scripts parse and versions agree
        run: ./scripts/check.sh
      - name: Security rules tests
        working-directory: tests/rules
        run: |
          npm install --no-audit --no-fund
          npx firebase emulators:exec --only firestore --project demo-test "node admin.test.mjs && node app.test.mjs && node battle.test.mjs"
