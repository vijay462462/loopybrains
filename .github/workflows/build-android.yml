name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Block screenshots (FLAG_SECURE)
        run: python3 patch_android.py
      - name: Sync web assets
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RGUKT-Spark.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RGUKT-Spark-apk
          path: android-app/RGUKT-Spark.apk
          retention-days: 30
